# Claude Code on request.
#
# Runs only when someone writes "@claude" in an issue, an issue comment, a PR
# comment or a PR review. Nothing runs automatically on new issues or PRs:
# triage, review, testing and development all happen only when asked.
#
# Claude starts from the issue-assistant playbook, which works out what is
# being asked and hands off to the matching playbook in .claude/skills/
# (issue-triage, dev-issue, pr-review, test-issue, regression-pack,
# epic-orchestrator).
#
# Setup (once): add a repository secret named ANTHROPIC_API_KEY
# (Settings → Secrets and variables → Actions), and install the Claude GitHub
# App on the repo (https://github.com/apps/claude). To use a Claude
# subscription instead of an API key, set CLAUDE_CODE_OAUTH_TOKEN and swap the
# commented line below.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# One run per issue/PR at a time; a second mention waits rather than racing.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # push claude/* branches
      pull-requests: write   # open PRs, post reviews
      issues: write          # comments, labels, sub-issues
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # playbooks use git log / git log -S for regression hunting

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # static check runs `node --check` on index.html's script

      # Browser for test-issue / regression-pack / reproducing bugs. Only
      # installed when the request looks like it needs one, to keep other runs fast.
      - name: Install Chromium for Playwright
        if: |
          contains(github.event.comment.body || github.event.review.body || github.event.issue.body, 'test') ||
          contains(github.event.comment.body || github.event.review.body || github.event.issue.body, 'regression') ||
          contains(github.event.comment.body || github.event.review.body || github.event.issue.body, 'triage') ||
          contains(github.event.comment.body || github.event.review.body || github.event.issue.body, 'reproduce')
        run: |
          npm install -g playwright@1
          npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}   # lets the playbooks use the gh CLI
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          branch_prefix: "claude/"
          claude_args: |
            --append-system-prompt "You are running in GitHub Actions for zboon/SacredTexts. Start by following .claude/skills/issue-assistant/SKILL.md, which routes the request to the right playbook in .claude/skills/. Follow .claude/skills/CONVENTIONS.md for labels, comment footers, branches and the version bump. Use ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} as the session link in comment footers. Never approve or merge a pull request."
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(ffmpeg:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(sed:*),Bash(mkdir:*),Bash(pkill:*),Edit,Write,Read,Glob,Grep"
