<!-- The bundled Arabic faces, fetched while the texts load rather than after
     the first render, so the Arabic doesn't visibly swap font. Font preloads
     need crossorigin even from this site, or they're fetched twice. (The
     masthead image isn't preloaded: Chrome won't match a preload to the
     script-built <img> under the service worker, so it only warned.) -->
<link rel="preload" href="fonts/UthmanicHafs.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/Amiri-Regular.woff" as="font" type="font/woff" crossorigin>
<style>

  /* ── Amiri (SIL Open Font License 1.1) ──────────────────────────────
     Bundled rather than fetched, so the Arabic — and crucially its harakat —
     renders correctly with no connection at all. Subset to Arabic + Latin and
     WOFF-compressed, with all layout features kept: Amiri's calligraphic
     ligatures are the reason to use it. Full licence in OFL.txt. */
  @font-face{
    font-family:'UthmanicHafs';
    font-style:normal; font-weight:400; font-display:swap;
    src:url(fonts/UthmanicHafs.otf) format('opentype');
    /* KFGQPC Uthmanic Hafs. It maps 171 codepoints — the Arabic comma,
       semicolon, question mark, full stop, the rosette and every Persian
       letter among them — to an EMPTY placeholder box that renders as a
       black blob. So it is served only for the codepoints it genuinely
       draws; everything else falls through to Amiri below, which is why a
       comma still looks like a comma. fonts/UthmanicHafs.otf is the original
       file byte for byte: the licence forbids modifying the font, so it can't
       be subset or converted. */
    unicode-range: U+0600, U+0621-063A, U+0640-0657, U+065C, U+065E, U+0660-0669, U+066E, U+0670-0671, U+06D6-06DD, U+06E0-06E2, U+06E4-06E9, U+06EC;
  }
  @font-face{
    font-family:'Amiri';
    font-style:normal; font-weight:400; font-display:swap;
    src:url(fonts/Amiri-Regular.woff) format('woff');
  }
  @font-face{
    font-family:'Amiri';
    font-style:normal; font-weight:700; font-display:swap;
    src:url(fonts/Amiri-Bold.woff) format('woff');
  }

  :root{
    --green:#123528;
    --green-deep:#0B241B;
    /* Ottoman-illumination palette for the home menu tiles and per-section
       theming. Each section's chrome (header, reader bar, floating docks)
       picks up one of these via --theme/--theme-deep, set per data-theme
       below. */
    --navy:#1B2A54;   --navy-deep:#101A38;   /* lapis lazuli */
    --maroon:#6B1E2E; --maroon-deep:#4A121F; /* Ottoman red-maroon */
    --teal:#0F5C56;   --teal-deep:#0A3F3A;   /* Iznik turquoise */
    --ochre:#8A5A20;  --ochre-deep:#5E3C12;  /* gilded ochre */
    --plum:#5A2450;   --plum-deep:#3C1836;   /* manuscript violet */
    --rust:#8A3324;   --rust-deep:#5E2118;   /* terracotta red */
    --indigo:#332B6B; --indigo-deep:#221D48; /* deep indigo */
    --neutral:#6B6355; --neutral-deep:#4A4438; /* muted, for "coming soon" */
    --theme:var(--green); --theme-deep:var(--green-deep);
    --paper:#FAF5EA;
    --bg:#FAF5EA;
    --card:#ffffff;
    --card-alt:#FCF8EF;
    --paper-edge:#EFE6D2;
    --gold:#B8934A;
    --gold-soft:#D8C193;
    --ms-paper:#FBF4DE;   /* the leaf itself */
    --ms-ink:#2A2118;
    --ms-rule:#6B4E2A;
    --ms-gold:#B8934A;
    --ms-rosette:#B23A2E;
    --ms-band-a:#2E6B63;  /* the woven band across the head of the leaf */
    --ms-band-b:#8C3B2F;
    --ms-mark:rgba(184,147,74,.28);
    --rule:rgba(184,147,74,.5);      /* fine gold hairline on the green */
    --rule-soft:rgba(184,147,74,.3); /* the same, quieter, on the paper */
    --ink:#26281F;
    --ink-soft:#6B6A5C;
    --chip-ink:#123528;   /* control-chip label; must contrast with the page, not the header */
    --ar-color:#0B241B;
    --star-fill:#BCD6E4;   /* light blue inside the seam-band stars */
    --band-field:#0B241B;  /* deep-green ground between the stars */
    --star-stroke:#CB8090; /* the calligraphy dots' pink, outlining the stars */
    --accent-green:#1E5540;    /* bismillah + section titles: light enough to read as green */
    --ar-size:1.9rem;
    --latin-scale:1;
  }
  :root.dark{
    --green:#1B3A2C;
    --green-deep:#0E2318;
    --navy:#2A3D70;   --navy-deep:#16234A;
    --maroon:#7A2836; --maroon-deep:#551A24;
    --teal:#166E66;   --teal-deep:#0E4F48;
    --ochre:#9C6B2C;  --ochre-deep:#6E4A1A;
    --plum:#6E3064;   --plum-deep:#4A2044;
    --rust:#9C4130;   --rust-deep:#6E2A1E;
    --indigo:#433A82; --indigo-deep:#2C255C;
    --neutral:#7C7364; --neutral-deep:#564F42;
    /* --paper stays light: it's the text colour on the green header/bars */
    --bg:#12150E;
    --card:#1E2318;
    --card-alt:#232819;
    --paper-edge:#2E3324;
    --gold:#C9A55E;
    --ms-paper:#191510;   /* the same leaf, inverted for a dark room */
    --ms-ink:#EADEC2;
    --ms-rule:#A98A55;
    --ms-gold:#C9A55E;
    --ms-rosette:#D9705F;
    --ms-band-a:#24504B;
    --ms-band-b:#6B2E26;
    --ms-mark:rgba(201,165,94,.26);
    --rule:rgba(201,165,94,.5);
    --rule-soft:rgba(201,165,94,.28);
    --gold-soft:#D8C193;
    --ink:#ECE7D6;
    --ink-soft:#C7C3AF;   /* brightened: was #A3A08E, too dim for the translation line */
    --chip-ink:#EFE7CF;   /* light label on the dark card, instead of the dark green */
    --ar-color:#F3ECD8;
    --star-fill:#7FA3B8;   /* deeper blue so the stars read on the dark page */
    --band-field:#0E2318;  /* deep-green ground between the stars */
    --star-stroke:#D793A2; /* dot-pink, lifted slightly for the dark theme */
    --accent-green:#618B77;    /* pushed toward the header's forest green (#1B3A2C) as far as
                                  readability allows: this also colours the ~19px section
                                  titles, which need 4.5:1. The header green itself is 1.5:1
                                  here — invisible. */
  }
  /* Per-section theming: html[data-theme] is set in JS (see sectionThemeOf)
     to whichever menu tile the current page belongs to. --theme/--theme-deep
     are what the header/chrome selectors below actually use, so every
     section's chrome follows its tile color automatically, in both light
     and dark mode, without duplicating rules per theme per mode. */
  html[data-theme="navy"]   { --theme:var(--navy);   --theme-deep:var(--navy-deep); }
  html[data-theme="maroon"] { --theme:var(--maroon); --theme-deep:var(--maroon-deep); }
  html[data-theme="teal"]   { --theme:var(--teal);   --theme-deep:var(--teal-deep); }
  html[data-theme="ochre"]  { --theme:var(--ochre);  --theme-deep:var(--ochre-deep); }
  html[data-theme="plum"]   { --theme:var(--plum);   --theme-deep:var(--plum-deep); }
  html[data-theme="rust"]   { --theme:var(--rust);   --theme-deep:var(--rust-deep); }
  html[data-theme="indigo"] { --theme:var(--indigo); --theme-deep:var(--indigo-deep); }
  html[data-theme="neutral"]{ --theme:var(--neutral);--theme-deep:var(--neutral-deep); }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    min-height:100vh;
    min-height:100dvh;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- header ---------- */
  .masthead{
    background:var(--theme);
    color:var(--paper);
    padding:calc(env(safe-area-inset-top, 0px) + 1.7rem) 1.4rem 1.3rem;
    text-align:center;
    position:relative;
  }
  /* Ottoman rosette medallion: the home page's sole logo, above the icon
     row. Home only — compactMasthead keeps the bismillah strip instead,
     and other readers keep their own bismillah, untouched by this. */
  .masthead .medallion-mark{
    display:block;
    width:min(210px, 50%);
    height:auto;
    margin:.3rem auto .6rem;
  }
  /* Sticky top chrome. Home shows the large logo header; every page below home
     shows a compact bar (see .masthead.compact) with no tab bar. Readers are
     separate — they render their own .reader-bar. */
  .topbar{ position:sticky; top:0; z-index:40; }
  html.is-home .topbar{ position:static; }   /* home keeps its large scroll-away header */
  html.immersive .topbar{ display:none; }
  html{ overflow-anchor:none; }
  /* Section pages (everything below home) use a compact bar instead of the
     large logo header: Home + Back on the left, the bismillah centred, Live +
     theme on the right, and NO tab bar. */
  .masthead.compact{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.5rem;
    padding:calc(env(safe-area-inset-top, 0px) + .55rem) .8rem .55rem;
    min-height:0;
  }
  .masthead.compact .mh-left{ display:flex; gap:.35rem; justify-self:start; }
  .masthead.compact .mh-right{ display:flex; gap:.35rem; justify-self:end; }
  .masthead.compact .bismillah-mark{ justify-self:center; height:auto; width:auto; max-height:2.4rem; max-width:min(46vw,12.5rem); margin:0; opacity:.98; }
  .masthead.compact .header-mark,
  .masthead.compact .back-mark,
  .masthead.compact .fav-mark,
  .masthead.compact .session-mark,
  .masthead.compact .theme-toggle{ position:static; top:auto; left:auto; right:auto; }
  .back-mark{
    width:2.3rem; height:2.3rem; border-radius:50%; border:none; cursor:pointer;
    background:rgba(250,245,234,.14); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
  }
  .back-mark:active{ background:rgba(250,245,234,.28); }
  .back-mark svg{ width:1.3rem; height:1.3rem; display:block; }
  /* Star band straddling the header seam: pulled up half its height. */
  .head-band svg{display:block;width:100%}
  /* Small Bismillah at the very top of the header, on every page. */
  .masthead .bismillah-mark{
    display:block;
    width:min(200px, 52%);
    height:auto;
    margin:0 auto .9rem;
    opacity:.92;
  }
  /* The English name sits in its own band below the calligraphy, ruled off
     from the header above and the section cards below. */
  .subhead{
    background:var(--theme); color:var(--paper); text-align:center;
    padding:.8rem 1.1rem .85rem;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }
  .head-en1{
    font-family:'Crimson Pro',serif;
    font-size:1.41rem;
    letter-spacing:.05em;
    color:var(--paper);
  }
  .head-en2{
    font-family:'Crimson Pro',serif;
    font-style:italic;
    font-size:1.1rem;
    color:var(--gold-soft);
    margin-top:.2rem;
  }
  .star-band{display:block;margin:1.1rem auto 0;width:min(240px,70%)}
  .theme-toggle{
    position:absolute;top:calc(env(safe-area-inset-top, 0px) + .8rem);right:.9rem;
    width:2.3rem;height:2.3rem;border-radius:50%;
    background:rgba(250,245,234,.14);color:var(--paper);
    font-size:1.15rem;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  /* Home button, top-left — mirrors the theme toggle on the opposite side. */
  /* Live session: a small header button rather than a full card. */
  .session-mark{
    position:absolute;top:calc(env(safe-area-inset-top, 0px) + .8rem);right:3.55rem;
    height:2.3rem;padding:0 .72rem;border-radius:999px;border:none;cursor:pointer;
    background:rgba(250,245,234,.14);color:var(--paper);
    font-family:'Crimson Pro',serif;font-size:.84rem;letter-spacing:.07em;line-height:1;
    display:flex;align-items:center;justify-content:center;white-space:nowrap;
  }
  .session-mark:active{background:rgba(250,245,234,.28)}
  /* Gold while a session is running, so it reads at a glance. */
  .session-mark.live{background:var(--gold);color:var(--theme)}
  .link-btn{
    background:none;border:none;padding:0;cursor:pointer;
    font-family:'Crimson Pro',serif;font-size:inherit;color:var(--accent-green);
    text-decoration:underline;
  }
  .build-tag{
    text-align:center; margin:1.6rem 0 .4rem;
    font-family:'Crimson Pro',serif; font-size:.58rem; letter-spacing:.1em;
    color:var(--ink-soft); opacity:.4;
  }
  .back-link{
    display:block;margin:.1rem auto .5rem;padding:.3rem .7rem;
    background:none;border:none;cursor:pointer;
    font-family:'Crimson Pro',serif;font-size:.95rem;color:var(--accent-green);
  }
  .header-mark{
    position:absolute;top:calc(env(safe-area-inset-top, 0px) + .8rem);left:.9rem;
    width:2.3rem;height:2.3rem;border-radius:50%;border:none;cursor:pointer;
    background:rgba(250,245,234,.14);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
  }
  .header-mark:active{background:rgba(250,245,234,.28)}
  .header-mark svg{width:1.3rem;height:1.3rem;display:block}
  .theme-toggle svg{width:1.3rem;height:1.3rem;display:block}
  .theme-toggle:active{background:rgba(250,245,234,.28)}
  /* Favorites moved off the home grid (it isn't one of the named menu
     sections), so it lives here instead — same treatment as header-mark,
     mirrored on the opposite side. */
  .fav-mark{
    position:absolute;top:calc(env(safe-area-inset-top, 0px) + .8rem);left:3.55rem;
    width:2.3rem;height:2.3rem;border-radius:50%;border:none;cursor:pointer;
    background:rgba(250,245,234,.14);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
  }
  .fav-mark:active{background:rgba(250,245,234,.28)}
  .fav-mark svg{width:1.15rem;height:1.15rem;display:block}

  /* ---------- top nav bar (sections, left-to-right) ---------- */
  .tabbar{
    display:flex;gap:.5rem;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding:.9rem 1rem;background:var(--theme-deep);
    border-bottom:1px solid var(--rule);
    scrollbar-width:none;
    justify-content:flex-start;
  }
  /* Center the tabs only when they all fit; when they overflow, this wrapper
     keeps them left-aligned so the first tab is always reachable to scroll. */
  .tabbar > .tab:first-child{margin-left:auto}
  .tabbar > .tab:last-child{margin-right:auto}
  .tabbar::-webkit-scrollbar{display:none}
  /* When tabs overflow on narrow screens they scroll; centering still holds
     because flex wraps naturally from the centre outward. */
  .tabbar::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.15rem;
    padding:.55rem .9rem;border-radius:12px;
    background:rgba(250,245,234,.08);color:var(--paper);
    border:1.5px solid transparent;transition:background .12s,border-color .12s;
    min-width:5.2rem;
  }
  .tab.active{background:var(--gold);border-color:var(--gold-soft);color:var(--theme-deep)}
  .tab-en{font-size:.78rem;font-weight:700;line-height:1.15;text-align:center;white-space:nowrap}
  .tab-ar{font-family:'UthmanicHafs','Amiri',serif;font-size:1rem;line-height:1;opacity:.85}
  .tab.active .tab-ar{opacity:1}

  /* ---------- placeholder for empty sections ---------- */
  .placeholder{
    text-align:center;color:var(--ink-soft);padding:2.4rem 1.4rem;line-height:1.6;
  }
  .placeholder .ph-star{font-family:'UthmanicHafs','Amiri',serif;font-size:2.4rem;color:var(--gold);margin-bottom:.6rem}
  .placeholder strong{color:var(--theme);font-size:1.05rem}
  .placeholder p{margin:.5rem 0}
  /* Texts that couldn't be loaded: a notice pinned to the foot of the screen,
     outside #app so re-renders leave it alone, naming each failed file. */
  .load-notice{
    position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);z-index:1000;
    width:min(34rem,calc(100% - 2rem));max-height:40vh;overflow:auto;
    background:var(--card);color:var(--ink);border:1px solid var(--gold);border-radius:12px;
    box-shadow:0 6px 24px rgba(0,0,0,.2);padding:.8rem 2.6rem .8rem 1rem;font-size:.85rem;line-height:1.45;
  }
  .load-notice ul{margin:.4rem 0 0;padding-left:1.1rem}
  .load-notice li{overflow-wrap:anywhere}
  .load-notice-x{position:absolute;top:.35rem;right:.45rem;border:0;background:none;color:var(--ink-soft);font-size:1.1rem;padding:.3rem;cursor:pointer}
  .load-failed .retry{padding:.55rem 1.3rem;border:0;border-radius:9px;background:var(--theme);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .load-failed .load-detail{font-size:.8rem;overflow-wrap:anywhere}
  /* Outside any section --theme is the green, which in dark mode barely shows
     on the page; the failure screen's heading must read in both themes. */
  html.dark .load-failed strong{color:var(--ink)}

  /* ---------- index list ---------- */
  .index{max-width:640px;margin:0 auto;padding:1.4rem 1.1rem calc(env(safe-area-inset-bottom,0px) + 3rem)}
  .index-label{
    font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-soft);margin:.4rem 0 1rem;text-align:center;
  }
  .search-wrap{position:relative;margin:.2rem 0 1.4rem}
  /* Resting: quiet — transparent, thin border, dimmed. It's there when you
     want it and out of the way when you don't. */
  .search{
    width:100%;box-sizing:border-box;
    font-family:inherit;font-size:.95rem;color:var(--ink);
    background:transparent;
    border:1px solid var(--paper-edge);border-radius:12px;
    padding:.6rem 2.4rem .6rem 2.3rem;outline:none;
    opacity:.7;box-shadow:none;
    transition:opacity .15s, background .15s, border-color .15s, box-shadow .15s;
  }
  .search:hover{opacity:.9}
  /* Focused: full contrast, gold border, lifted */
  .search:focus{
    opacity:1;
    background:var(--card);
    border-color:var(--gold);
    box-shadow:0 2px 10px rgba(18,53,40,.10);
  }
  .search::placeholder{color:var(--ink-soft);opacity:.75}
  .search-icon{
    position:absolute;left:.8rem;top:50%;transform:translateY(-50%);
    width:.95rem;height:.95rem;color:var(--ink-soft);
    opacity:.5;pointer-events:none;
    transition:opacity .15s, color .15s;
  }
  .search-wrap:focus-within .search-icon{opacity:1;color:var(--gold)}
  /* On the home page the bar is pinned to the bottom of the screen.
     Note: position:sticky does NOT work here — a sticky element can only travel
     inside its parent's box, and this is the last child of .index, so its whole
     range would be that element's own bottom padding (~3rem). Fixed is correct. */
  .search-wrap.at-bottom{
    position:fixed;
    left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom, 0px) + .85rem + var(--player-h));
    width:min(605px, calc(100% - 2.2rem));
    margin:0;
    z-index:20;
  }
  /* Needs a solid backdrop here — content scrolls underneath it. */
  .search-wrap.at-bottom .search{
    opacity:1;
    background:var(--card);
    box-shadow:0 2px 12px rgba(0,0,0,.10);
  }
  .search-wrap.at-bottom .search:focus{
    box-shadow:0 4px 16px rgba(0,0,0,.16);
  }
  .search::placeholder{color:var(--ink-soft);opacity:.7}
  .search-clear{
    position:absolute;right:.5rem;top:50%;transform:translateY(-50%);
    width:1.9rem;height:1.9rem;border-radius:50%;
    color:var(--ink-soft);font-size:.85rem;
    display:flex;align-items:center;justify-content:center;
  }
  .search-clear:active{background:var(--paper-edge)}
  .no-results{
    text-align:center;color:var(--ink-soft);font-size:.95rem;
    padding:2rem 1rem;line-height:1.5;
  }
  .qcard{
    display:flex;align-items:center;gap:1rem;width:100%;text-align:left;
    background:var(--card);
    border:1px solid var(--paper-edge);
    border-radius:14px;
    padding:1rem 1.1rem;
    margin-bottom:.8rem;
    box-shadow:0 1px 2px rgba(18,53,40,.06);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .qcard:active{transform:scale(.985)}
  .qcard .num{
    flex:none;width:2.4rem;height:2.4rem;border-radius:50%;
    border:1.5px solid var(--gold);color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'UthmanicHafs','Amiri',serif;font-size:1.15rem;padding-top:2px;
  }
  /* The two title lines were plain inline spans, so they only fell onto
     separate lines when the Arabic happened to be long enough to wrap. A short
     leading line (a day name) left room for the Arabic to ride up beside it.
     Stacking them explicitly makes the break structural rather than accidental. */
  .qcard .titles{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch}
  .qcard .t-ar{font-family:'UthmanicHafs','Amiri',serif;font-size:1.35rem;line-height:1.4;direction:rtl;text-align:left;color:var(--ar-color)}
  .qcard .t-en{font-size:.85rem;color:var(--ink-soft);margin-top:.1rem}
  /* Where and when a sohbet was given, under its title in the list. */
  .qcard .t-meta{
    display:block; font-size:.68rem; letter-spacing:.04em; text-transform:uppercase;
    color:var(--gold); margin-top:.25rem;
  }
  /* Dalāʾil index only: the English day name leads and the Arabic ḥizb title
     sits under it. A line that comes first has to carry the weight of a title,
     so it takes ink colour and a little more size; the Arabic eases down a
     step in turn, without giving up its place as the larger of the two. */
  .qcard .t-en.lead{font-size:1rem;color:var(--ink);font-weight:600;margin-top:0}
  .qcard .t-en.lead + .t-ar{font-size:1.2rem;margin-top:.15rem}
  .qcard .chev{color:var(--gold);font-size:1.2rem}
  /* Silsila only: a small portrait sits where the plain numeral circle
     usually goes, with the order number moved to a corner badge. Most
     masters start with no image, so .ph-initial (the Arabic initial of
     their name) stands in until a real thumbnail is added. */
  .qcard-silsila .master-avatar{
    position:relative;flex:none;width:2.6rem;height:2.6rem;border-radius:50%;
    overflow:hidden;border:1.5px solid var(--gold);background:var(--paper-edge);
    display:flex;align-items:center;justify-content:center;
  }
  .qcard-silsila .master-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .qcard-silsila .master-avatar .ph-initial{
    font-family:'UthmanicHafs','Amiri',serif;color:var(--gold);font-size:1.2rem;line-height:1;
  }
  .qcard-silsila .master-avatar .badge{
    position:absolute;bottom:-3px;right:-3px;min-width:1.15rem;height:1.15rem;padding:0 .15rem;
    border-radius:50%;background:var(--card);border:1px solid var(--gold);box-sizing:border-box;
    font-family:'UthmanicHafs','Amiri',serif;font-size:.62rem;color:var(--gold);
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- reader ---------- */
  .reader-bar{
    position:sticky;top:0;z-index:10;
    transition:padding .24s ease;
    background:var(--theme);color:var(--paper);
    padding:calc(env(safe-area-inset-top,0px) + .6rem) .8rem .6rem;
    display:flex;align-items:center;gap:.6rem;
    box-shadow:0 2px 8px rgba(11,36,27,.25);
  }
  .reader-bar .back{font-size:1rem;font-weight:700;padding:.45rem .7rem;border-radius:9px;background:rgba(250,245,234,.12)}
  .reader-bar .rtitle{flex:1;font-family:'UthmanicHafs','Amiri',serif;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  /* Back is a text button and the bookmark an icon, so they're different widths.
     Holding each in an equal-width side keeps the bismillah on the bar's true
     centre rather than centred between the buttons. */
  .reader-bar .rside{ flex:1 1 0; display:flex; align-items:center; min-width:0 }
  .reader-bar .rside.end{ justify-content:flex-end }
  /* The bismillah sits in the green bar, set apart from the piece's own title. */
  .reader-bismillah{
    display:block; width:min(150px, 40%); height:auto;
    opacity:.94; flex:0 0 auto;
    transition:width .24s ease, opacity .18s ease;
  }
  /* Once you scroll into the verses the bar slims to just Back and bookmark. */
  .reader-bar.slim .reader-bismillah{ width:0; opacity:0; }
  .reader-bar.slim{ padding-top:calc(env(safe-area-inset-top,0px) + .45rem); padding-bottom:.45rem; }
  .piece-head{ text-align:center; padding:.95rem 1rem .1rem; }
  /* ── The piece set as a manuscript leaf ─────────────────────────────────
     Ivory paper, a ruled border, a titled cartouche and rosettes between
     phrases. All type, so it stays sharp at any size and can be selected. */
  /* The leaves sit in a row and turn right to left, as an Arabic book does. */
  .ms-book{
    display:flex; direction:rtl;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    align-items:flex-start;
    scrollbar-width:none; padding-bottom:.2rem;
  }
  .ms-book::-webkit-scrollbar{ display:none }
  .ms-sheet{
    flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always;
    max-width:660px; margin:0 auto; padding:0 .7rem;
    display:flex; flex-direction:column;
  }
  /* ── Two leaves at once, as an open book ─────────────────────────
     The scroller is already RTL, so the earlier leaf sits on the RIGHT and its
     pair to the left, the way the printed book falls open, with the gutter
     falling between them. Pairs run from the first leaf.
     Snapping is put on the odd children only, so a swipe moves a whole spread
     rather than a single page; in RTL the odd child's start edge is its right
     edge, so aligning it to the container's start seats the pair exactly. */
  .ms-book.spread .ms-sheet{
    flex:0 0 50%; max-width:none; padding:0 .35rem; scroll-snap-align:none;
  }
  .ms-book.spread .ms-sheet:nth-child(odd){ scroll-snap-align:start; }
  .ms-book.spread .ms-page{ min-height:min(72dvh, calc((50vw - 1.4rem) * 1.2)); }
  .ms-nav{ display:flex; align-items:center; justify-content:center; gap:1rem; padding:.7rem 0 1.4rem; }
  .ms-nav .ms-arrow{ width:2.2rem; height:2.2rem; font-size:1.25rem; box-shadow:none; opacity:.95 }
  /* The arrows ride over the leaf, always within reach — top of the page or
     bottom, zoomed in or out. */
  .ms-float{
    position:fixed; top:50%; left:0; right:0; transform:translateY(-50%);
    display:flex; justify-content:space-between; padding:0 .55rem;
    pointer-events:none; z-index:40;
  }
  .ms-float .ms-arrow{ pointer-events:auto; }
  /* On a narrow screen the floating arrows sit over the text itself rather than
     beside it, so they are taken away there. The leaf still turns by swiping,
     and the arrows beside the page dots below are untouched for anyone who
     would rather tap. */
  @media (max-width: 560px){
    .ms-float{ display:none; }
  }
  /* First page sits at the right, as the text is read. */
  .ms-dots{ display:flex; direction:rtl; gap:.45rem; }
  .ms-arrow{
    width:2.5rem; height:2.5rem; border-radius:50%; cursor:pointer; padding:0;
    border:1px solid var(--ms-gold); color:var(--ms-gold);
    background:var(--ms-paper); opacity:.88;
    box-shadow:0 2px 10px rgba(11,36,27,.28);
    font-size:1.45rem; line-height:1; display:flex; align-items:center; justify-content:center;
    transition:opacity .15s, background .15s;
  }
  .ms-arrow:disabled{ opacity:.2; cursor:default; box-shadow:none }
  .ms-arrow:not(:disabled):active{ background:var(--ms-mark); opacity:1 }
  .ms-dot{
    width:.62rem; height:.62rem; border-radius:50%; cursor:pointer; padding:0; flex:0 0 auto;
    border:1px solid var(--ms-gold); background:transparent; opacity:.55;
    transition:opacity .15s, background .15s;
  }
  .ms-dot.on{ background:var(--ms-gold); opacity:1 }
  .ms-runhead{
    text-align:center; font-family:'UthmanicHafs','Amiri',serif; font-size:.82rem;
    color:var(--ms-rule); opacity:.85; margin:0 0 .4rem;
  }
  .ms-page{
    background:var(--ms-paper); color:var(--ms-ink);
    padding:1.5rem 1.15rem 2.3rem; position:relative; border-radius:2px;
    flex:0 0 auto;
    /* Each leaf holds exactly one printed page's text (cut at the book's own
       page turns). msAutoFit gives every leaf in a chapter one shared height
       and scales its Arabic to fill it, so the pages match each other the way
       the printed ones do; this min-height is the pre-script fallback and the
       floor for a very short chapter. A full page at readable size stands
       taller than the screen, so a leaf is read by scrolling down it. */
    min-height:min(72dvh, calc((100vw - 1.4rem) * 1.5));
    overflow:hidden;
    border:1.5px solid var(--ms-rule);
    box-shadow:0 0 0 3px var(--ms-paper) inset, 0 0 0 4.5px var(--ms-gold) inset,
               0 3px 14px rgba(11,36,27,.18);
  }
  /* The illuminated band across the head of the opening leaf. */
  .ms-band{
    position:relative; margin:-.5rem -.2rem 1.15rem; padding:.55rem 0;
    text-align:center; min-height:2.6rem;
    display:flex; align-items:center; justify-content:center;
  }
  /* A mid-leaf division band (thulth / rubʿ markers), as the book sets them. */
  .ms-band-div{ margin-top:1.4rem; }
  .ms-band-inline{ display:block; margin:1.15rem 0 1.05rem; }
  .ms-cartouche-div{ font-size:.98rem; }
  .ms-band-art{ position:absolute; left:0; right:0; top:50%;
    transform:translateY(-50%); height:40px; width:100%; display:block; }
  /* A mid-chapter division is a pause, not a second headpiece. */
  .ms-band-div .ms-band-art{ opacity:.55; }
  .ms-cartouche{ position:relative; z-index:1; }
  .ms-cartouche{
    display:inline-block; padding:.28rem 1.5rem;
    background:var(--ms-paper); color:var(--ms-ink);
    border:1px solid var(--ms-gold); border-radius:999px;
    font-family:'UthmanicHafs','Amiri',serif; font-size:1.12rem; line-height:1.7;
  }
  .ms-text{
    font-family:'UthmanicHafs','Amiri',serif; direction:rtl; text-align:center;
    /* Base reading size. msAutoFit scales each leaf around this so every page
       in a chapter is the same height with its text filling the frame; the
       densest page sits at about this size and lighter pages a little above. */
    font-size:1.55rem; line-height:2.15;
  }
  .ms-basmala{
    display:block; text-align:center; margin:0 0 1.05rem;
    padding:0 0 .75rem; border-bottom:1px solid var(--ms-gold);
  }
  .ms-v{ cursor:pointer; border-radius:4px; padding:.05em .12em;
         transition:background .15s ease; }
  .ms-v:active{ background:var(--ms-mark) }
  .ms-v.marked{ background:var(--ms-mark); box-shadow:0 0 0 1px var(--ms-gold) }
  /* One saved resume spot in the Book Version — a heavier gold ring than a
     plain highlight, so the bookmarked verse reads differently from phrases
     marked for study. Background/ring only (no added box), so it can never
     shift where a leaf breaks. */
  .ms-v.placed{ background:var(--ms-mark); box-shadow:0 0 0 2px var(--ms-gold), 0 0 0 4px rgba(184,147,74,.18) }
  @keyframes msFlash{ 0%{ background:var(--ms-gold) } 100%{ background:var(--ms-mark) } }
  .ms-v.ms-flash{ animation:msFlash 1.1s ease-out 1; }
  /* Verse-level search matches, listed under a chapter card. */
  .hits{ margin:-.1rem 0 .6rem; padding-left:.9rem; display:flex; flex-direction:column; gap:.3rem; }
  .hit{ display:flex; flex-direction:column; gap:.15rem; width:100%; text-align:right;
        background:var(--card-alt); border:1px solid var(--paper-edge); border-left:2px solid var(--gold);
        border-radius:10px; padding:.5rem .7rem; font:inherit; cursor:pointer; }
  .hit:active{ transform:scale(.99); }
  .hit .h-ar{ font-family:'UthmanicHafs','Amiri',serif; font-size:1.02rem; color:var(--ar-color); direction:rtl; line-height:1.5; }
  .hit .h-tr{ font-size:.76rem; color:var(--ink-soft); direction:ltr; text-align:left; line-height:1.35; }
  .hit mark{ background:rgba(201,165,94,.32); color:inherit; border-radius:3px; padding:0 .08em; }
  .hit-more{ font-size:.66rem; color:var(--ink-soft); opacity:.85; padding:.1rem 0 .1rem .2rem; }
  @keyframes hitFlash{ 0%{ box-shadow:0 0 0 2px var(--gold), 0 0 16px rgba(201,165,94,.55); } 100%{ box-shadow:0 0 0 0 rgba(201,165,94,0); } }
  .verse.hit-flash{ animation:hitFlash 1.3s ease-out 1; }
  .seg-flash{ animation:segFlash 1.5s ease-out 1; border-radius:3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .seg.marked{ background:rgba(201,165,94,.30); border-radius:3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .seg.placed{ background:rgba(201,165,94,.50); border-radius:3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  @keyframes segFlash{ 0%,12%{ background:rgba(201,165,94,.42); } 100%{ background:transparent; } }
  .ms-r{ color:var(--ms-rosette); font-size:.82em; padding:0 .18em; }
  /* Whatever face the Arabic body text is set in, the rosette keeps Amiri's
     star so every one on the page matches. */
  /* One rosette everywhere — Amiri's gold star. The font is forced because the
     body Arabic can be set in another face whose ۞ is a heavy disc, and the
     colour is forced so a rosette reads the same in the reader and on the page.
     The ﷺ mark keeps its own ink colour via the .ms-r.salawat rule below. */
  .ms-r, .rosette{
    font-family:'Amiri',serif !important;
    color:transparent !important;
    font-size:.82em; padding:0 .14em;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(0%2012%2012)%22%20fill%3D%22%238C3B2F%22%20stroke%3D%22%23C9A55E%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(45%2012%2012)%22%20fill%3D%22%238C3B2F%22%20stroke%3D%22%23C9A55E%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(90%2012%2012)%22%20fill%3D%22%238C3B2F%22%20stroke%3D%22%23C9A55E%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(135%2012%2012)%22%20fill%3D%22%238C3B2F%22%20stroke%3D%22%23C9A55E%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(180%2012%2012)%22%20fill%3D%22%238C3B2F%22%20stroke%3D%22%23C9A55E%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(225%2012%2012)%22%20fill%3D%22%238C3B2F%22%20stroke%3D%22%23C9A55E%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(270%2012%2012)%22%20fill%3D%22%238C3B2F%22%20stroke%3D%22%23C9A55E%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(315%2012%2012)%22%20fill%3D%22%238C3B2F%22%20stroke%3D%22%23C9A55E%22%20stroke-width%3D%22.8%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223%22%20fill%3D%22%23C9A55E%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%221.2%22%20fill%3D%22%23FBF4DE%22%2F%3E%3C%2Fsvg%3E");
    background-repeat:no-repeat; background-position:center;
    background-size:1.24em 1.24em;
  }
  /* A data URI can't read a CSS variable, so the night palette is its own image. */
  html.dark .ms-r, html.dark .rosette{
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(0%2012%2012)%22%20fill%3D%22%236B2E26%22%20stroke%3D%22%23B8934A%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(45%2012%2012)%22%20fill%3D%22%236B2E26%22%20stroke%3D%22%23B8934A%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(90%2012%2012)%22%20fill%3D%22%236B2E26%22%20stroke%3D%22%23B8934A%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(135%2012%2012)%22%20fill%3D%22%236B2E26%22%20stroke%3D%22%23B8934A%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(180%2012%2012)%22%20fill%3D%22%236B2E26%22%20stroke%3D%22%23B8934A%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(225%2012%2012)%22%20fill%3D%22%236B2E26%22%20stroke%3D%22%23B8934A%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(270%2012%2012)%22%20fill%3D%22%236B2E26%22%20stroke%3D%22%23B8934A%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M12%2C2.5C14.7%2C6.3%2014.7%2C9.3%2012%2C12C9.3%2C9.3%209.3%2C6.3%2012%2C2.5Z%22%20transform%3D%22rotate(315%2012%2012)%22%20fill%3D%22%236B2E26%22%20stroke%3D%22%23B8934A%22%20stroke-width%3D%22.8%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223%22%20fill%3D%22%23B8934A%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%221.2%22%20fill%3D%22%23191510%22%2F%3E%3C%2Fsvg%3E");
  }
  /* The صلى الله عليه وسلم mark is a letterform, not an ornament — it keeps its glyph. */
  .ms-r.salawat, html.dark .ms-r.salawat{
    color:var(--ms-ink) !important; background-image:none;
  }
  /* The ṣallā-Llāhu ʿalayhi wa-sallam mark, as the printing sets it after
     each name — larger than a rosette, and in the ink rather than the red. */
  .ms-r.salawat{ color:var(--ms-ink) !important; font-size:1em; padding:0 .12em; opacity:.85 }
  .v-salawat{ color:var(--accent-green); font-size:.9em }
  .ms-folio{
    position:absolute; left:0; right:0; bottom:.75rem; text-align:center;
    font-family:'UthmanicHafs','Amiri',serif; font-size:.85rem; color:var(--ms-rule);
  }
  .ms-folio::before, .ms-folio::after{
    content:'—'; color:var(--ms-gold); padding:0 .45rem; opacity:.8;
  }
  /* The closing leaf: ornament in the four corners, text held in the middle. */
  .ms-closing{ display:flex; flex-direction:column; justify-content:center; }
  .ms-closing .ms-text{ position:relative; z-index:1; padding:1.6rem .6rem; }
  .ms-orn{ position:absolute; width:26%; max-width:104px; aspect-ratio:1/1; pointer-events:none; }
  .ms-orn svg{ width:100%; height:100%; display:block }
  .ms-orn.tl{ top:.35rem; left:.35rem }
  .ms-orn.tr{ top:.35rem; right:.35rem; transform:scaleX(-1) }
  .ms-orn.bl{ bottom:.35rem; left:.35rem; transform:scaleY(-1) }
  .ms-orn.br{ bottom:.35rem; right:.35rem; transform:scale(-1,-1) }
  /* Discrete recitations sit as their own sections rather than running on. */
  .ms-sec{ margin:0 0 1rem; padding:0 0 .95rem; border-bottom:1px solid var(--ms-gold); }
  .ms-sec:last-child{ border-bottom:none; padding-bottom:0; margin-bottom:0 }
  .ms-sec-head{
    font-family:'Crimson Pro',serif; font-size:.78rem; letter-spacing:.04em;
    color:var(--ms-rule); direction:ltr; margin-bottom:.35rem;
  }
  .ms-hint{
    text-align:center; font-family:'Crimson Pro',serif; font-size:.82rem;
    color:var(--ink-soft); opacity:.75; margin:.1rem 0 .9rem;
  }
  .piece-title-ar{
    font-family:'UthmanicHafs','Amiri',serif; font-size:1.45rem; line-height:1.6;
    color:var(--accent-green);
  }
  .piece-title-en{
    font-family:'Crimson Pro',serif; font-size:.95rem; color:var(--ink-soft);
    margin-top:.1rem;
  }
  /* A sohbet's place and date, set below its title. */
  .piece-meta{
    font-size:.7rem; letter-spacing:.06em; text-transform:uppercase;
    color:var(--gold); margin-top:.45rem;
  }
  .reader-bar .spacer{width:3.4rem}

  .controls{
    max-width:640px;margin:0 auto;padding:.8rem 1.1rem 0;
    display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;
  }
  .chip{
    font-size:.8rem;font-weight:700;letter-spacing:.03em;
    padding:.4rem .85rem;border-radius:999px;
    border:1.5px solid var(--gold);color:var(--chip-ink);background:transparent;
  }
  /* "Off" reads by its muted grey border and label, not by fading the text out —
     opacity alone made it unreadable on the dark background. */
  .chip.off{opacity:.85;border-color:var(--ink-soft);color:var(--ink-soft)}
  .chip.size{border-color:var(--paper-edge);background:var(--card)}

  .verses{max-width:640px;margin:0 auto;padding:1.2rem 1.1rem calc(env(safe-area-inset-bottom,0px) + 7rem)}
  /* Book Version: trim the trailing space so the reader can't scroll far past a
     leaf's end — the nav sits just below, and the bottom gap is limited so at
     most about a sixth of a screen shows under the current page. */
  .verses.ms-view{ padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16dvh); }
  .verses.ms-view .ms-nav{ margin-top:.6rem; }
  .refrain-note{
    text-align:center;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);font-weight:700;margin:.2rem 0 1rem;
  }
  .qnote{
    background:var(--theme);color:var(--paper);
    border-radius:14px;padding:.9rem 1.1rem;margin-bottom:.9rem;
    font-size:.92rem;line-height:1.5;text-align:center;
  }
  .qnote .qnote-ar{
    display:block;font-family:'UthmanicHafs','Amiri',serif;font-size:1.15rem;
    color:var(--gold-soft);direction:rtl;margin-top:.4rem;
  }
  /* A long note is folded away by default. Short ones stay open — the fold is
     there to keep the reader from scrolling past an essay to reach the prayer,
     and a one-line note costs nothing to leave showing. */
  details.qnote{ padding:0; overflow:hidden; }
  details.qnote > summary{
    list-style:none; cursor:pointer; padding:.72rem 1.1rem;
    display:flex; align-items:center; justify-content:center; gap:.45rem;
    font-size:.86rem; letter-spacing:.02em;
  }
  details.qnote > summary::-webkit-details-marker{ display:none; }
  details.qnote > summary::marker{ content:''; }
  .qnote-chev{
    display:inline-block; color:var(--gold-soft); font-size:1.05rem; line-height:1;
    transition:transform .18s ease;
  }
  details.qnote[open] > summary .qnote-chev{ transform:rotate(90deg); }
  .qnote-body{
    padding:0 1.1rem .95rem;
    border-top:1px solid rgba(216,193,147,.28); margin-top:0; padding-top:.8rem;
  }

  /* ── Dalāʾil index (Option E): today card + labelled bilingual bubbles ── */
  .dk-today{
    display:flex; flex-direction:column; align-items:center; gap:.2rem; width:100%; text-align:center;
    background:linear-gradient(160deg,var(--theme),var(--accent-green)); color:var(--paper);
    border:1.5px solid var(--gold); border-radius:16px; padding:.85rem .95rem;
    margin-bottom:.5rem; font:inherit; cursor:pointer;
  }
  .dk-today:active{ transform:scale(.995); }
  .dk-today-k{ font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-soft); font-weight:700; }
  .dk-today-ar{ font-family:'UthmanicHafs','Amiri',serif; font-size:1.5rem; direction:rtl; }
  .dk-today-go{ font-size:.82rem; color:var(--gold-soft); }
  /* Row labels: English in spaced caps, Arabic reset (letter-spacing breaks the
     cursive join) and set in the mushaf face. */
  .dk-rowlab{ display:flex; justify-content:center; align-items:baseline; gap:.4rem; margin:.85rem .15rem .35rem; }
  .dk-rowlab .l-en{ font-size:.72rem; letter-spacing:.13em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .dk-rowlab .l-ar{ font-family:'UthmanicHafs','Amiri',serif; font-size:1rem; letter-spacing:0; color:var(--gold-soft); direction:rtl; }
  /* Bubbles. Before-the-reading is a 2-col grid (long names), the days a 4-col
     grid (4 + 4, Mon² last), completion a single full-width line. */
  .dk-grid2{ display:grid; grid-template-columns:repeat(2,1fr); gap:.45rem; margin-bottom:.4rem; }
  .dk-grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:.4rem; margin-bottom:.4rem; }
  .dk-sep{ height:1px; background:var(--rule-soft); margin:.9rem .2rem .7rem; }
  .dk-bubble{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.12rem;
    background:var(--card); border:1px solid var(--paper-edge); color:var(--ink);
    border-radius:16px; padding:.55rem .45rem; font:inherit; cursor:pointer; text-align:center; min-height:3.3rem;
  }
  .dk-bubble:active{ transform:scale(.97); }
  .dk-bubble .b-en{ font-size:.8rem; font-weight:600; color:var(--ink); line-height:1.2; }
  .dk-bubble .b-ar{ font-family:'UthmanicHafs','Amiri',serif; font-size:1rem; color:var(--ar-color); direction:rtl; line-height:1.4; }
  .dk-grid4 .b-ar{ font-size:.9rem; }
  .dk-bubble.on{ background:var(--accent-green); border-color:var(--accent-green); }
  .dk-bubble.on .b-en{ color:var(--paper); }
  .dk-bubble.on .b-ar{ color:var(--gold-soft); }
  .dk-full{ width:100%; flex-direction:row; justify-content:space-between; align-items:center; padding:.7rem .95rem; margin-bottom:.4rem; }
  .dk-full .b-en{ font-size:.9rem; }
  .dk-full .b-ar{ font-size:1.15rem; }
  /* "Before the reading" is one bubble that opens its own sub-page. */
  .dk-nav{
    display:flex; align-items:center; justify-content:center; gap:.6rem; width:100%; position:relative;
    background:var(--card); border:1px solid var(--paper-edge); color:var(--ink);
    border-radius:16px; padding:.7rem .95rem; margin-bottom:.5rem; font:inherit; cursor:pointer; text-align:center;
  }
  .dk-nav:active{ transform:scale(.99); }
  .dk-nav-txt{ display:flex; flex-direction:column; align-items:center; gap:.1rem; min-width:0; }
  .dk-nav .b-en{ font-size:.9rem; font-weight:600; color:var(--ink); }
  .dk-nav .b-ar{ font-family:'UthmanicHafs','Amiri',serif; font-size:1.15rem; color:var(--ar-color); direction:rtl; }
  .dk-nav-go{ position:absolute; right:.95rem; top:50%; transform:translateY(-50%); color:var(--gold); font-size:1.35rem; line-height:1; }
  .qtune{
    display:flex;align-items:center;justify-content:center;gap:.4rem;
    background:var(--card);border:1.5px solid var(--gold);color:var(--theme);
    border-radius:999px;padding:.6rem 1rem;margin-bottom:1.2rem;
    font-weight:700;font-size:.9rem;text-decoration:none;
  }
  .qtune:active{background:var(--paper-edge)}
  button.qtune{ width:100%; font-family:inherit; cursor:pointer; }

  /* ── The docked reciter ──────────────────────────────────────────
     Fixed to the foot of the window and attached to <body>, outside #app —
     the same trick the session banner uses — so re-rendering the reader never
     reloads the iframe and the recitation carries on while you turn leaves and
     move into the next section. Its measured height is published as
     --player-h, which is what lets full screen work: the leaf sizing, the page
     padding and the floating arrows all subtract it rather than sitting under
     it. Deliberately NOT in the html.immersive hide list — reading along with
     the recitation is the whole point. */
  :root{ --player-h:0px; }
  body.has-player{ padding-bottom:var(--player-h); }
  .ytdock{
    position:fixed; left:0; right:0; bottom:0; z-index:70;
    background:var(--theme-deep); color:var(--paper);
    border-top:1px solid var(--rule);
    padding:.5rem .7rem calc(env(safe-area-inset-bottom,0px) + .5rem);
    box-shadow:0 -6px 22px rgba(0,0,0,.32);
  }
  .ytdock-in{ display:flex; align-items:center; gap:.6rem; max-width:640px; margin:0 auto; }
  .ytdock-frame{
    flex:0 0 auto; width:120px; aspect-ratio:16/9;
    border-radius:8px; overflow:hidden; background:#000;
  }
  .ytdock-frame iframe{ width:100%; height:100%; border:0; display:block; }
  .ytdock.big .ytdock-in{ flex-direction:column; align-items:stretch; }

  /* The audio dock must stack. .ytdock-in is a flex ROW by default, and the
     <audio> element carries width:100% — as a flex item that grows to fill
     the row, and .ytdock-meta's min-width:0 lets it collapse to nothing. The
     title, reciter, speed and download controls were all still in the DOM,
     just squeezed to zero width, leaving only the bare scrubber. */
  .ytdock.audio{ padding:.4rem .7rem calc(.4rem + env(safe-area-inset-bottom)); }
  .ytdock.audio .ytdock-in{ flex-direction:column; align-items:stretch; gap:.35rem; }
  .ytdock.audio .ytdock-meta{ flex:0 0 auto; }
  .ytdock.audio audio{ width:100%; height:34px; display:block; margin:0; }
  @media (max-width:420px){
    .ytdock.audio .ytdock-title{ font-size:.8rem; }
    .ytdock.audio .ytdock-reciter{ font-size:.68rem; }
    .ytdock.audio .ytdock-btn{ padding:.2rem .5rem; font-size:.7rem; }
    .ytdock.audio audio{ height:30px; }
  }
  .ytdock.big .ytdock-frame{ width:100%; }
  .ytdock-meta{ flex:1; min-width:0; display:flex; align-items:center; gap:.45rem; }
  .ytdock-title{
    flex:1; min-width:0; font-family:'Crimson Pro',serif; font-size:.85rem;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* Title and reciter stack, so the name survives the ellipsis that the
     single nowrap line would otherwise eat on a phone. */
  .ytdock-titles{ flex:1; min-width:0; display:flex; flex-direction:column; gap:.05rem; }
  .ytdock-titles .ytdock-title{ flex:none; }
  .ytdock-reciter{
    font-family:'Crimson Pro',serif; font-size:.72rem; opacity:.72;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ytdock-reciter .r-ar{ font-family:'UthmanicHafs',serif; font-size:.8rem; }

  /* the downloaded-recitations list */

<script>
/* ================================================================
   CONTENT
   ----------------------------------------------------------------
   Every text lives in content/<section>/: one JSON file per piece,
   and an index.json listing the pieces in reading order. These
   arrays start empty; loadContent() fills them before the first
   render, so the rest of the script can treat them as ordinary
   arrays. How to write and add pieces: content/README.md.
   ================================================================ */
const CONTENT_ROOT = 'content/';
const CONTENT_SECTIONS = [];   // { folder, pieces }, in the order declared below

/* An empty array that loadContent() fills from content/<folder>/. */
function contentSection(folder){
  const pieces = [];
  CONTENT_SECTIONS.push({ folder, pieces });
  return pieces;
}

const QASIDAS            = contentSection('qasidas');
const SIRAH_CHAPTERS     = contentSection('sirah');
const BARZANJI_CHAPTERS  = contentSection('barzanji');
const DIYA_CHAPTERS      = contentSection('diya');
const BURDAH_CHAPTERS    = contentSection('burdah');
const DALAIL_CHAPTERS    = contentSection('dalail');
const LITANY_CHAPTERS    = contentSection('litanies');
const SILSILA_CHAPTERS   = contentSection('silsila');
const TURUQ_CHAPTERS     = contentSection('turuqs');
const SOHBET_CHAPTERS    = contentSection('sohbets');
const ILAHI_CHAPTERS     = contentSection('ilahis');
const NASHEED_CHAPTERS   = contentSection('nasheeds');
const BIOGRAPHY_CHAPTERS = contentSection('biographies');
const OTTOMAN_CHAPTERS   = contentSection('ottoman');

/* One JSON file. Every error names the file, so it's clear what to fix.
   'no-cache' always asks the server whether the file changed, so an edit
   shows on the next reload even before the service worker is running. */
async function fetchJSON(path){
  let resp;
  try { resp = await fetch(path, { cache: 'no-cache' }); }
  catch(e){ throw new Error(path + ': could not be fetched'); }
  if(!resp.ok) throw new Error(path + ': HTTP ' + resp.status);
  const text = await resp.text();
  try { return JSON.parse(text); }
  catch(e){ throw new Error(path + ': ' + e.message); }
}

/* One section, all or nothing: its pieces go in only once every file has
   arrived, so a failure can leave a section empty but never shift the
   positions the code relies on (the Dalāʾil days, the Aʿẓam and Istighfār
   days). Resolves with the section's error messages; none when it loaded. */
async function loadSection({ folder, pieces }){
  const dir = CONTENT_ROOT + folder + '/';
  let names;
  try { names = await fetchJSON(dir + 'index.json'); }
  catch(e){ return [e.message]; }
  if(!Array.isArray(names)) return [dir + 'index.json: should be a list of file names'];
  const results = await Promise.allSettled(names.map(name => fetchJSON(dir + name + '.json')));
  const errors = [];
  results.forEach((r, i) => {
    if(r.status === 'rejected') errors.push(r.reason.message);
    else if(!isPiece(r.value)) errors.push(dir + names[i] + '.json: needs "titleEnglish" (text) and "verses" (a list)');
  });
  if(!errors.length) pieces.push(...results.map(r => r.value));
  return errors;
}

/* The least a piece needs: search and the readers rely on both. */
function isPiece(p){
  return !!p && typeof p === 'object' && typeof p.titleEnglish === 'string' && Array.isArray(p.verses);
}

/* Every section, in parallel. nothingLoaded: not one section arrived. */
async function loadContent(){
  const perSection = await Promise.all(CONTENT_SECTIONS.map(loadSection));
  return {
    errors: perSection.flat(),
    nothingLoaded: perSection.every(errors => errors.length > 0),
  };
}

/* ---------------- app logic ---------------- */
const app = document.getElementById('app');
const AR_NUMS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
// Devotion/verse number badges use standard (Western) numerals for easy reading;
// the gold-circle styling is unchanged. Swap to AR_NUMS mapping to go Arabic-script.
const toArNum = n => String(n);
/* The ‖ marker is Book-Version pagination only — it tells manuscriptPages where
   the printed page turns and must never reach the reader's eye, so the Study
   view strips it out. */
const stripBreaks = s => String(s).replace(/\s*\u2016\s*/g, ' ').trim();
/* Rosettes are always set in the same hand, whichever Arabic face the body text
   uses — otherwise a font whose ۞ is a heavy disc sits next to one whose ۞ is a
   star, and the page looks inconsistent. */
/* Dalāʾil highlight portions: break at each rosette ۞ AND comma ، (comma stays on the page, rosette drawn as its own mark). segParts=text, segWrap=HTML; both count identically so a flash targets the right portion. */
function segParts(s){ let out=[],buf=''; const push=t=>{ if(buf.trim()!=='') out.push(buf+t); buf=''; }; for(const ch of String(s)){ if(ch==='۞') push(''); else if(ch==='،') push('،'); else buf+=ch; } push(''); return out; }
function segWrap(s, rosClass){ let out='',buf='',sg=0; const emit=t=>{ if(buf.trim()!==''){ out+='<span class="seg" data-sg="'+sg+'">'+buf+t+'</span>'; sg++; } buf=''; }; for(const ch of String(s)){ if(ch==='۞'){ emit(''); out+='<span class="'+rosClass+'">۞</span>'; } else if(ch==='،'){ emit('،'); } else buf+=ch; } emit(''); return sg? out : '<span class="seg" data-sg="0">'+String(s)+'</span>'; }
function segWrapMark(s, rosClass, kind, idx, keyN, marks, placedHere, placedSeg){ let out='',buf='',sg=0; const emit=t=>{ if(buf.trim()!==''){ const k=kind+':'+idx+':'+keyN+':'+sg; const mk=marks[k]?' marked':''; const pl=(placedHere && placedSeg===sg)?' placed':''; out+='<span class="seg'+mk+pl+'" data-sg="'+sg+'" data-mk="'+k+'" onclick="markVerse(\''+kind+'\','+idx+',\''+keyN+'\','+sg+')">'+buf+t+'</span>'; sg++; } buf=''; }; for(const ch of String(s)){ if(ch==='۞'){ emit(''); out+='<span class="'+rosClass+'">۞</span>'; } else if(ch==='،'){ emit('،'); } else buf+=ch; } emit(''); if(!sg){ const k=kind+':'+idx+':'+keyN+':0'; out='<span class="seg" data-sg="0" data-mk="'+k+'" onclick="markVerse(\''+kind+'\','+idx+',\''+keyN+'\',0)">'+String(s)+'</span>'; } return out; }
const withRosettes = (s, seg) => seg ? segWrap(s, 'rosette') : String(s).split('۞').join('<span class="rosette">۞</span>');
const arHTML = (s, seg) => markInline(withRosettes(stripBreaks(s).replaceAll('\n','<br>'), seg), false);

/* ── Favourites ──────────────────────────────────────────────────
   Stored in this browser's localStorage, so they stay on the device and are
   never shared between people opening the same hosted link.
   The key is kind + titleEnglish (unique within every array) rather than an
   array index, so favourites survive adding, removing or reordering pieces.
   A favourite whose title is later edited is simply dropped. */
const FAV_KEY = 'mawlid-favs';

function loadFavs(){
  try { const v = JSON.parse(localStorage.getItem(FAV_KEY)); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function saveFavs(){
  try { localStorage.setItem(FAV_KEY, JSON.stringify(state.favs)); } catch(e){}
}

/* ── Where you left off (Dalāʾil only) ───────────────────────────
   A ribbon, not a shelf: exactly one place is kept, and saving a new one
   replaces it. This is deliberately separate from favourites — a favourite
   marks a piece you want to find again, a place marks how far you have read
   through a long portion you mean to finish. */
const PLACE_KEY = 'mawlid-dalail-place';

function loadPlace(){
  try {
    const p = JSON.parse(localStorage.getItem(PLACE_KEY));
    return (p && typeof p.idx === 'number') ? p : null;
  } catch(e){ return null; }
}
function writePlace(p){ try { localStorage.setItem(PLACE_KEY, JSON.stringify(p)); } catch(e){} }

/* The saved place is tied to the chapter's title as well as its index, so a
   place doesn't silently point at the wrong portion if the order ever changes. */
function placeChapter(){
  const p = loadPlace();
  if(!p) return null;
  const c = DALAIL_CHAPTERS[p.idx];
  if(!c) return null;
  if(p.title && c.titleEnglish !== p.title) return null;
  return { p, c };
}
function placeIsHere(idx){
  const cur = placeChapter();
  return !!cur && cur.p.idx === idx;
}

/* The first verse still on screen — where the eye is, not where the page
   happens to begin. */
function topVisibleVerse(){
  const arts = document.querySelectorAll('main.verses article.verse[data-v]');
  for(let i=0;i<arts.length;i++){
    if(arts[i].getBoundingClientRect().bottom > 96) return +arts[i].dataset.v;
  }
  return arts.length ? +arts[arts.length-1].dataset.v : 0;
}

/* Bookmark one exact verse in the Study view. Tapping the ribbon on a verse
   moves the bookmark there; tapping the same verse again lifts it. Only one
   verse is ever marked, so the ribbon shows you precisely where you stopped
   rather than roughly how far down the page you were. */
function placeVerse(idx, n){
  const cur = loadPlace();
  const same = cur && cur.idx === idx && cur.view === 'study' && cur.verse === n;
  const prev = document.querySelector('article.verse.placed');
  if(prev) prev.classList.remove('placed');
  const btnPrev = document.querySelector('.verse-place.on');
  if(btnPrev) btnPrev.classList.remove('on');

  if(same){                       // tapping the marked verse lifts the bookmark
    try { localStorage.removeItem(PLACE_KEY); } catch(e){}
    return;
  }
  const c = DALAIL_CHAPTERS[idx];
  if(!c) return;
  writePlace({ idx, title: c.titleEnglish || '', at: Date.now(), view: 'study', verse: n });
  const el = document.querySelector('article.verse[data-v="' + n + '"]');
  if(el){
    el.classList.add('placed');
    const b = el.querySelector('.verse-place');
    if(b) b.classList.add('on');
  }
}

/* Is this the verse currently bookmarked? */
function placedVerse(idx, n){
  const cur = loadPlace();
  return !!cur && cur.idx === idx && cur.view === 'study' && cur.verse === n;
}

/* ── Book-Version verse bookmarking ───────────────────────
   The Study view marks a verse with a ribbon; a Book leaf has no room for one
   per phrase without disturbing the leaf-fit engine, so instead the verse you
   last tapped (highlighted) becomes the candidate and "Save my place" stores
   it. Only one place exists app-wide, shared with the Study bookmark. */
let msPlaceCandidate = null;

/* The whole-verse index from a mark key "d:idx:n" or a split chunk "d:idx:n.c". */
function mkVerseIndex(mk){
  const parts = String(mk).split(':');
  return parseInt(parts[2], 10);        // parseInt stops at the dot for "n.c"
}

/* The Book-Version span for a verse — its first chunk if the verse was split
   across pages, so the bookmark lands on the leaf where the verse begins. */
function msVerseEl(idx, n){
  const base = 'd:' + idx + ':' + n;
  return document.querySelector('[data-mk="' + base + '"]')
      || document.querySelector('[data-mk^="' + base + '."]');
}

/* The top-most verse still on screen on the current leaf — the fallback when
   the reader saves without having tapped a verse. */
function topVisibleMsVerse(){
  const book = document.getElementById('ms-book');
  if(!book) return null;
  const sheet = book.children[msCurrentPage()];
  if(!sheet) return null;
  const vs = sheet.querySelectorAll('.ms-v[data-mk]');
  for(let i=0;i<vs.length;i++){
    if(vs[i].getBoundingClientRect().bottom > 96) return mkVerseIndex(vs[i].getAttribute('data-mk'));
  }
  return vs.length ? mkVerseIndex(vs[vs.length-1].getAttribute('data-mk')) : null;
}

/* Show which verse holds the bookmark — one at a time. */
function markPlacedMsVerse(idx, n, seg){
  [].forEach.call(document.querySelectorAll('.placed'), el => el.classList.remove('placed'));
  if(seg != null){ const s = document.querySelector('[data-mk="d:' + idx + ':' + n + ':' + seg + '"]'); if(s){ s.classList.add('placed'); return; } }
  const el = msVerseEl(idx, n);
  if(el) el.classList.add('placed');
}

function saveDalailPlace(idx){
  const c = DALAIL_CHAPTERS[idx];
  if(!c) return;
  const p = { idx, title: c.titleEnglish || '', at: Date.now(),
              view: state.pageView ? 'book' : 'study' };
  if(p.view === 'book'){
    /* The verse the reader last tapped in this chapter, else the top of the
       page they are on. Only fall back to a bare leaf if no verse is found. */
    let n = (msPlaceCandidate && msPlaceCandidate.idx === idx) ? msPlaceCandidate.n : null;
    let sg = (msPlaceCandidate && msPlaceCandidate.idx === idx) ? msPlaceCandidate.seg : null;
    if(n == null) n = topVisibleMsVerse();
    if(n == null) p.leaf = msCurrentPage();
    else { p.verse = n; if(sg != null) p.seg = sg; markPlacedMsVerse(idx, n, sg); }
  } else {
    p.verse = topVisibleVerse();
  }
  writePlace(p);
  const btn = document.querySelector('.place-btn');
  if(btn){
    btn.classList.add('on');
    btn.textContent = 'Place saved';
    setTimeout(() => { if(btn.isConnected) btn.textContent = 'Save my place'; }, 1600);
  }
}

function clearDalailPlace(){
  /* Guard against a stray tap: this wipes the saved place and every Dalāʾil
     verse bookmark. Favorites (mawlid-favs) are a separate store, untouched. */
  if(typeof confirm === 'function' &&
     !confirm('Clear your Dalāʾil bookmarks?\n\nThis removes your saved place and every verse bookmark in the Dalāʾil. Your favorites are not affected.')) return;
  try { localStorage.removeItem(PLACE_KEY); } catch(e){}
  /* Clear every Book-Version verse bookmark in the Dalāʾil too (mark keys are
     "kind:idx:n", so Dalāʾil marks start "d:"), so Clear wipes the resume place
     and all gold-ring verse bookmarks together. */
  try {
    const m = loadMarks();
    let changed = false;
    Object.keys(m).forEach(k => { if(k.slice(0, 2) === 'd:'){ delete m[k]; changed = true; } });
    if(changed) localStorage.setItem('mawlid-marks', JSON.stringify(m));
  } catch(e){}
  msPlaceCandidate = null;
  renderIndex();
}

/* Reopen the saved chapter in the view it was saved from and go to the spot.
   The jump is repeated once after a moment because the leaves are measured and
   fitted after the fonts land, which moves everything below them. */
function resumeDalail(){
  const cur = placeChapter();
  if(!cur) return;
  const { p, c } = cur;
  const hasPages = Array.isArray(c.folios) && c.folios.length > 0;
  state.pageView = (p.view === 'book') && hasPages;
  openDalail(p.idx);
  const go = () => {
    if(state.pageView){
      const book = document.getElementById('ms-book');
      if(!book) return;
      let sheet = null, vEl = null;
      if(p.verse != null){
        vEl = msVerseEl(p.idx, p.verse);
        if(vEl) sheet = vEl.closest('.ms-sheet');
      }
      if(!sheet && p.leaf != null) sheet = book.children[p.leaf];   // older page-level bookmark
      if(sheet){
        sheet.scrollIntoView({ block:'nearest', inline:'center' });
        if(typeof msSyncDots === 'function') msSyncDots();
      }
      if(vEl){
        markPlacedMsVerse(p.idx, p.verse);
        const r = vEl.getBoundingClientRect();
        if(r.top < 84 || r.bottom > window.innerHeight - 8){
          window.scrollTo({ top: Math.max(0, r.top + window.scrollY - 96) });
        }
        vEl.classList.remove('ms-flash'); void vEl.offsetWidth; vEl.classList.add('ms-flash');
      }
    } else if(p.verse != null){
      const el = document.querySelector('article.verse[data-v="' + p.verse + '"]');
      if(el) window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 84) });
    }
  };
  if(window.requestAnimationFrame) requestAnimationFrame(() => requestAnimationFrame(go));
  else setTimeout(go, 40);
  setTimeout(go, 320);
}

/* The card that offers the place back, shown at the head of the Dalāʾil tab. */
function resumeCard(){
  const cur = placeChapter();
  if(!cur) return '';
  const { p, c } = cur;
  const where = p.view === 'book'
    ? (p.verse != null
        ? 'Book Version · verse ' + toArNum(p.verse + 1)
        : 'Book Version · page ' + ((p.leaf || 0) + 1))
    : 'Study Version · verse ' + toArNum((p.verse || 0) + 1);
  return `<div class="resume-wrap">
      <button class="resume-card" onclick="resumeDalail()">
        <span class="resume-ribbon">${bookmarkIcon(true)}</span>
        <span class="resume-text">
          <span class="resume-label">Continue where you left off</span>
          <span class="resume-ar">${c.titleArabic}</span>
          <span class="resume-where">${where}</span>
        </span>
        <span class="chev">›</span>
      </button>
      <button class="resume-clear" onclick="clearDalailPlace()">Clear</button>
    </div>`;
}

const state = { showTr: true, showEn: true, arScale: 1, latinScale: 1, msZoom: 1, query: '', tab: 'home', burdahChapter: null, favs: loadFavs() , pageView:true, immersive:false};

/* The content arrays, keyed by the same letters as OPENERS. */
function arrayOf(kind){
  return kind === 'q' ? QASIDAS
       : kind === 'b' ? BURDAH_CHAPTERS
       : kind === 's' ? SIRAH_CHAPTERS
       : kind === 'i' ? ILAHI_CHAPTERS
       : kind === 'd' ? DALAIL_CHAPTERS
       : kind === 'z' ? BARZANJI_CHAPTERS
       : kind === 'y' ? DIYA_CHAPTERS
       : kind === 'n' ? NASHEED_CHAPTERS
       : kind === 'l' ? LITANY_CHAPTERS
       : kind === 'c' ? SILSILA_CHAPTERS
       : kind === 't' ? TURUQ_CHAPTERS
       : kind === 'h' ? SOHBET_CHAPTERS
       : kind === 'g' ? BIOGRAPHY_CHAPTERS
       : kind === 'o' ? OTTOMAN_CHAPTERS
       : null;
}
function pieceOf(kind, idx){ const a = arrayOf(kind); return a ? a[idx] : null; }
function favKey(kind, piece){ return kind + '|' + piece.titleEnglish; }
function isFav(kind, idx){
  const p = pieceOf(kind, idx);
  return !!p && state.favs.includes(favKey(kind, p));
}
function toggleFav(kind, idx){
  const p = pieceOf(kind, idx);
  if(!p) return;
  const key = favKey(kind, p);
  const at = state.favs.indexOf(key);
  if(at >= 0) state.favs.splice(at, 1); else state.favs.push(key);
  saveFavs();
  updateFavUI(kind, idx);
}
/* Bookmark glyph: outline when unsaved, filled when saved. Drawn as SVG so it
   takes the app's gold via currentColor instead of an emoji's fixed colour. */
function bookmarkIcon(on){
  return `<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"
    fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.7"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 3.5h11a.9.9 0 0 1 .9.9v15.8a.5.5 0 0 1-.77.42L12 16.8l-5.63 3.82a.5.5 0 0 1-.77-.42V4.4a.9.9 0 0 1 .9-.9z"/>
  </svg>`;
}

/* Update the star in place, so tapping it never disturbs your scroll position */
function updateFavUI(kind, idx){
  const btn = document.querySelector('.fav-btn');
  if(!btn) return;
  const on = isFav(kind, idx);
  btn.innerHTML = bookmarkIcon(on);
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-label', on ? 'Remove bookmark' : 'Bookmark this');
}
/* Resolve saved keys back to live pieces, skipping any that no longer exist */
function favItems(){
  const out = [];
  state.favs.forEach(key => {
    const kind = key.slice(0, 1);
    const title = key.slice(2);
    const arr = arrayOf(kind);
    if(!arr) return;
    const idx = arr.findIndex(p => p.titleEnglish === title);
    if(idx >= 0) out.push({ kind, idx, piece: arr[idx] });
  });
  return out;
}

/* Fuzzy-normalize transliterated Arabic so different English spellings match.
   e.g. "Qaseeda", "kasida", "qasīda" all collapse to the same key.
   Steps: lowercase → strip diacritics/accents → drop non-letters →
   fold interchangeable sounds (q/k, ph/f, etc.) → collapse doubled letters. */
function normalize(str){
  if(!str) return '';
  let s = str.toLowerCase();
  // strip combining diacritical marks (ā ṣ ḥ ʿ etc.)
  s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  // strip Arabic harakat/tatweel and fold letter variants, so searching Arabic
  // works whether or not the person types the vowel marks
  s = s.replace(/[\u064b-\u065f\u0670\u0640]/g, '');
  s = s.replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/ة/g, 'ه');
  // remove Arabic transliteration marks and punctuation, keep a-z and arabic block
  s = s.replace(/[ʿʾ'`’‘_\-.,;:!?()\[\]"۞·‖]/g, ' ');
  // sound-folding for common spelling variants
  s = s
    .replace(/ph/g, 'f')
    .replace(/ck/g, 'k')
    .replace(/q/g, 'k')      // qasida = kasida
    .replace(/dh/g, 'd')
    .replace(/th/g, 't')
    .replace(/gh/g, 'g')
    .replace(/kh/g, 'h')
    .replace(/sh/g, 's')
    .replace(/ee/g, 'i')     // nabee = nabi
    .replace(/ii/g, 'i')
    .replace(/ea/g, 'i')
    .replace(/oo/g, 'u')     // rasool = rasul
    .replace(/ou/g, 'u')
    .replace(/uu/g, 'u')
    .replace(/aa/g, 'a')     // salaam = salam
    .replace(/y/g, 'i')      // naby = nabi
    .replace(/w/g, 'u');
  // collapse any remaining doubled letters (rabbi = rabi, muhammad = muhamad)
  s = s.replace(/(.)\1+/g, '$1');
  // squeeze whitespace
  return s.replace(/\s+/g, ' ').trim();
}

/* Build a searchable haystack for each qasida (title + all verse text). */
function haystack(q){
  const parts = [q.titleEnglish, q.titleArabic];
  q.verses.forEach(v => { parts.push(v.tr, v.en, v.ar); });
  const joined = parts.join(' ');
  const norm = normalize(joined);
  return {
    norm,
    // space-free copy, so word breaks don't matter: "mawla ya" == "mawlaya".
    // Doubles are re-collapsed AFTER squeezing, since removing a space can
    // create one ("ar rahman" -> "arrahman" -> "arahman").
    tight: tighten(norm),
    raw: joined.toLowerCase(),
    ar: joined
  };
}

/* Space-free, double-free form used for spacing-insensitive matching. */
function tighten(normalized){
  return normalized.replace(/\s+/g, '').replace(/(.)\1+/g, '$1');
}

function matchesQuery(q, query){
  if(!query) return true;
  const nq = normalize(query);
  const h = haystack(q);
  // match on normalized (fuzzy) OR raw lowercase OR arabic-script substring
  if(nq && h.norm.includes(nq)) return true;
  // spacing-insensitive: "mawla ya" and "mawlaya" both find the same verse
  const tq = tighten(nq);
  if(tq && h.tight.includes(tq)) return true;
  const rawq = query.toLowerCase().trim();
  if(h.raw.includes(rawq)) return true;
  if(/[\u0600-\u06ff]/.test(query) && h.ar.includes(query.trim())) return true;
  return false;
}

/* ---------- Verse-level search: matching lines + jump-to-verse ---------- */
function escHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* A snippet of `text` windowed around the query, the match wrapped in <mark>.
   Falls back to a plain truncation when the match was only via normalisation. */
function hitSnippet(text, q, win){
  const raw = String(text || ''); if(!raw) return '';
  win = win || 110;
  let i = -1, len = 0;
  const ql = (q||'').toLowerCase().trim();
  if(ql){ i = raw.toLowerCase().indexOf(ql); if(i>=0) len = ql.length; }
  if(i < 0 && /[\u0600-\u06ff]/.test(q||'')){ const qa=q.trim(); i = raw.indexOf(qa); if(i>=0) len = qa.length; }
  if(i < 0) return escHTML(raw.length > win ? raw.slice(0,win).trim()+'\u2026' : raw);
  const half = Math.floor(win/2);
  const a = Math.max(0, i-half), b = Math.min(raw.length, i+len+half);
  return (a>0?'\u2026':'') + escHTML(raw.slice(a,i)) + '<mark>' + escHTML(raw.slice(i,i+len)) + '</mark>' + escHTML(raw.slice(i+len,b)) + (b<raw.length?'\u2026':'');
}

/* Which lines of a chapter match the current query, and in which field. */
/* Which rosette-segment of a verse the search match sits in (Arabic = exact; tr/en = by position). */
function hitSeg(v, f, q){
  const ar = stripBreaks(v.ar || ''); const segs = segParts(ar);
  if(segs.length <= 1) return 0;
  const isAr = /[\u0600-\u06ff]/.test(q||'');
  if(f === 'ar' || isAr){ const nq = normalize(q); for(let i=0;i<segs.length;i++){ if(normalize(segs[i]).includes(nq)) return i; } }
  const field = String(v[f] || ''); const mi = field.toLowerCase().indexOf(String(q||'').toLowerCase().trim());
  if(mi < 0) return 0; const frac = field.length ? mi/field.length : 0;
  const target = frac * segs.reduce((a,p)=>a+p.length,0); let cum = 0;
  for(let i=0;i<segs.length;i++){ cum += segs[i].length; if(cum >= target) return i; } return segs.length - 1;
}
function verseHits(c){
  const q = state.query;
  if(!q || !c || !c.verses) return [];
  const nq = normalize(q), tq = tighten(nq), rawq = q.toLowerCase().trim(), isAr = /[\u0600-\u06ff]/.test(q);
  const test = raw => { if(!raw) return false; const nf = normalize(raw);
    return (nq && nf.includes(nq)) || (tq && tighten(nf).includes(tq)) || raw.toLowerCase().includes(rawq) || (isAr && raw.includes(q.trim())); };
  const out = [];
  for(let n=0; n<c.verses.length; n++){
    const v = c.verses[n], ar = stripBreaks(v.ar || '');
    let f = null;
    if(test(v.en)) f='en'; else if(test(v.tr)) f='tr'; else if(test(ar)) f='ar';
    if(!f) continue;
    out.push({ n, ar, sec: f==='ar' ? '' : (v[f]||''), seg: hitSeg(v, f, q) });
    if(out.length >= 40) break;
  }
  return out;
}

/* The matching-lines list rendered under a chapter card during a search. */
function hitList(kind, idx){
  if(!state.query) return '';
  const arr = arrayOf(kind); if(!arr) return '';
  const c = arr[idx]; if(!c) return '';
  const hits = verseHits(c); if(!hits.length) return '';
  const CAP = 6, shown = hits.slice(0, CAP);
  const rows = shown.map(h => {
    const ar = `<span class="h-ar">${hitSnippet(h.ar, state.query, 120)}</span>`;
    const tr = h.sec ? `<span class="h-tr">${hitSnippet(h.sec, state.query, 130)}</span>` : '';
    return `<button class="hit" onclick="jumpToVerse('${kind}',${idx},${h.n},${h.seg})">${ar}${tr}</button>`;
  }).join('');
  const extra = hits.length - CAP;
  const more = extra > 0 ? `<div class="hit-more">+${extra} more line${extra>1?'s':''} in this reading</div>` : '';
  return `<div class="hits">${rows}${more}</div>`;
}

/* Scroll to a specific verse in whichever view is open, and flash it. Both
   views share the verse index, so the same n lands on the same line. */
function scrollToVerse(kind, idx, n, seg){
  const book = document.getElementById('ms-book');
  if(book){
    const vEl = document.querySelector('[data-mk="'+kind+':'+idx+':'+n+'"]')
             || document.querySelector('[data-mk^="'+kind+':'+idx+':'+n+'."]');
    if(!vEl) return false;
    const sheet = vEl.closest('.ms-sheet');
    if(sheet){ sheet.scrollIntoView({ block:'nearest', inline:'center' }); if(typeof msSyncDots==='function') msSyncDots(); }
    const r = vEl.getBoundingClientRect();
    if(r.top < 84 || r.bottom > window.innerHeight - 8) window.scrollTo({ top: Math.max(0, r.top + window.scrollY - 96) });
    (()=>{ const sg=(seg!=null)?vEl.querySelector('.seg[data-sg="'+seg+'"]'):null; if(sg){ sg.classList.remove('seg-flash'); void sg.offsetWidth; sg.classList.add('seg-flash'); } else { vEl.classList.remove('ms-flash'); void vEl.offsetWidth; vEl.classList.add('ms-flash'); } })();
    return true;
  }
  const el = document.querySelector('article.verse[data-v="'+n+'"]');
  if(!el) return false;
  window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 84) });
  (()=>{ const sg=(seg!=null)?el.querySelector('.seg[data-sg="'+seg+'"]'):null; if(sg){ sg.classList.remove('seg-flash'); void sg.offsetWidth; sg.classList.add('seg-flash'); } else { el.classList.remove('hit-flash'); void el.offsetWidth; el.classList.add('hit-flash'); } })();
  return true;
}

/* Run scrollToVerse once the (re)built leaves settle — the Book Version measures
   and fits after the fonts land, which shifts everything, so retry once. */
function afterViewScroll(kind, idx, n, seg){
  if(n == null) return;
  const run = () => { if(!scrollToVerse(kind, idx, n, seg)) setTimeout(() => scrollToVerse(kind, idx, n, seg), 280); };
  if(window.requestAnimationFrame) requestAnimationFrame(() => requestAnimationFrame(run));
  else setTimeout(run, 40);
}

/* Open a reader at a specific verse and flash it — Book or Study, any kind. */
function jumpToVerse(kind, idx, n, seg){
  const fn = window[openFnOf(kind)];
  if(typeof fn !== 'function') return;
  fn(idx);
  afterViewScroll(kind, idx, n, seg);
}

/* ── Mawlid ad-Daybaʿi: one ordered section ──────────────────────
   The mawlid's pieces live in two arrays: QASIDAS (its duas and qasidas)
   and SIRAH_CHAPTERS (its prose). Each carries its section number from the
   kitab in its title, e.g. "13b · …". We merge both and sort by that number
   so the tab follows the book's own order. A qasida with NO section number
   didn't come from the mawlid — it belongs under the Qasidas tab. */
const SECTION_RE = /^(\d+)(b?)\s*·\s*(.*)$/;

function sectionOf(title){
  const m = SECTION_RE.exec(title || '');
  if(!m) return null;
  return { num: +m[1] + (m[2] ? 0.5 : 0), label: m[1] + m[2], rest: m[3] };
}

function mawlidItems(){
  const items = [];
  QASIDAS.forEach((qa, i) => {
    const sec = sectionOf(qa.titleEnglish);
    if(sec) items.push({ sec, kind:'q', idx:i, piece:qa });
  });
  SIRAH_CHAPTERS.forEach((c, n) => {
    const sec = sectionOf(c.titleEnglish);
    if(sec) items.push({ sec, kind:'s', idx:n, piece:c });
  });
  items.sort((a,b) => a.sec.num - b.sec.num);
  /* Number them 1..N by their place in the kitab's order. The badge is a
     running position, not the kitab's own number, so the list never skips
     even though some of the kitab's sections aren't in the app yet. Adding a
     missing section later slots it in and renumbers everything automatically. */
  items.forEach((it, n) => { it.pos = n + 1; });
  return items;
}

function mawlidCards(){
  /* Position is assigned before filtering, so searching never renumbers. */
  const items = mawlidItems().filter(x => matchesQuery(x.piece, state.query));
  if(items.length === 0) return '';
  return items.map(({pos, kind, idx, piece}) => `

}

/* The daily portion for today — Monday opens Part 1; the second Monday portion
   (Mon²) is reached from the strip. JS getDay(): 0=Sun … 6=Sat. */
const DALAIL_WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DALAIL_TODAY_IDX = { 1:6, 2:7, 3:8, 4:9, 5:10, 6:11, 0:12 };
function dalailTodayIdx(){ return DALAIL_TODAY_IDX[new Date().getDay()]; }

/* The week strip and the three collapsible groups. */
const DALAIL_DAYS = [
  {idx:6,  en:'Mon',        ar:'الِاثْنَيْن'},
  {idx:7,  en:'Tue',        ar:'الثُّلَاثَاء'},
  {idx:8,  en:'Wed',        ar:'الأَرْبِعَاء'},
  {idx:9,  en:'Thu',        ar:'الْخَمِيس'},
  {idx:10, en:'Fri',        ar:'الْجُمُعَة'},
  {idx:11, en:'Sat',        ar:'السَّبْت'},
  {idx:12, en:'Sun',        ar:'الأَحَد'},
  {idx:13, en:'Mon \u00B2', ar:'الِاثْنَيْن ٢'},
];
const DALAIL_ROWS = {
  before: {en:'Before the reading', ar:'قَبْلَ الْقِرَاءَةِ'},
  daily:  {en:'The daily portions', ar:'الْأَحْزَابُ الْيَوْمِيَّةُ'},
